<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Говори: speak Russian</title>
<meta name="theme-color" content="#2443B5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Говори">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<script>
/* Apply the saved light/dark choice before the page paints. */
(function(){ try{ const t=localStorage.getItem('govori-theme'); if(t==='light'||t==='dark') document.documentElement.dataset.theme=t; }catch(e){} })();
</script>
<style>
:root{
  --bg:#DCEBFC; --surface:#F2F8FF; --ink:#13204A; --muted:#475576; --line:#B8CEEC;
  --cobalt:#2443B5; --cobalt-ink:#FFFFFF; --cobalt-soft:#C8DBF6; --amber:#B86E0A; --amber-soft:#FBEBD2;
  --good:#1D7448; --good-soft:#DDF2E6; --bad:#B3261E; --bad-soft:#FBE3E1;
  --display:'Unbounded', 'Golos Text', system-ui, sans-serif;
  --body:'Golos Text', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A1430; --surface:#12224A; --ink:#E9EEFB; --muted:#9DA9CC; --line:#253A70;
    --cobalt:#8099F5; --cobalt-ink:#0A1430; --cobalt-soft:#1C2F66; --amber:#F2B24F; --amber-soft:#3A2D16;
    --good:#62C891; --good-soft:#163B2A; --bad:#F38B82; --bad-soft:#44201E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1430; --surface:#12224A; --ink:#E9EEFB; --muted:#9DA9CC; --line:#253A70;
  --cobalt:#8099F5; --cobalt-ink:#0A1430; --cobalt-soft:#1C2F66; --amber:#F2B24F; --amber-soft:#3A2D16;
  --good:#62C891; --good-soft:#163B2A; --bad:#F38B82; --bad-soft:#44201E;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px;border-radius:8px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:12px 16px}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.01em;color:var(--cobalt);margin-right:auto;background:none;border:0;padding:0}
.chip{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:15px;padding:5px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.chip.streak{color:var(--amber)}
.chip{white-space:nowrap}
@media (max-width:400px){.top-in{gap:7px;padding:10px 12px}.chip{font-size:13.5px;padding:4px 8px}.brand{font-size:19px}.top .icon-btn{width:36px;height:36px}}

main{max-width:760px;margin:0 auto;padding:22px 20px 120px}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.15;margin:0}
h1{font-size:clamp(26px,6vw,34px);letter-spacing:-.015em}
h2{font-size:21px;margin-bottom:12px}
h3{font-size:17px}
p{margin:0 0 12px}
.lead{color:var(--muted);max-width:60ch}
.stack>*+*{margin-top:14px}
.section{margin-top:30px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(7,1fr)}
.tab{background:none;border:0;padding:10px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12.5px;font-weight:600;color:var(--muted)}
.tab .g{font-family:var(--display);font-size:18px;line-height:1.1;white-space:nowrap}
@media (max-width:420px){.tab{font-size:11.5px;padding-left:0;padding-right:0}.tab .g{font-size:15px}}
.tab[aria-current="page"]{color:var(--cobalt)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:600;background:var(--cobalt);color:var(--cobalt-ink)}
.btn.ghost{background:transparent;color:var(--cobalt);border:1.5px solid var(--cobalt)}
.btn.quiet{background:var(--cobalt-soft);color:var(--ink)}
.btn.small{padding:8px 13px;font-size:15px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;flex:none;padding:0}
.icon-btn svg{width:20px;height:20px;fill:var(--cobalt)}
.say-pair{display:inline-flex;gap:6px;flex:none;vertical-align:middle}
.say-pair .slow-ic{font-size:19px;line-height:1}
.save-btn svg.mark,.saved-top svg{fill:none;stroke:var(--cobalt);stroke-width:2;stroke-linejoin:round}
.save-btn.on svg.mark{fill:var(--cobalt)}
.saved-top{position:relative}
.saved-top .badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--cobalt);color:var(--cobalt-ink);font-size:11px;font-weight:700;line-height:18px;text-align:center}
.say-pair.sm .save-btn svg{width:15px;height:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:15px;font-weight:600;color:var(--ink)}
.chips button[aria-pressed="true"]{background:var(--cobalt);border-color:var(--cobalt);color:var(--cobalt-ink)}
.saying .lit-line{font-style:italic}
.saying dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:12px 0 0;font-size:16px}
.saying dt{color:var(--muted);font-weight:600}
.saying dd{margin:0}
.say-pair.sm{margin-right:8px}
.say-pair.sm .icon-btn{width:30px;height:30px}
.say-pair.sm svg{width:16px;height:16px}
.say-pair.sm .slow-ic{font-size:15px}
.kl{transition:color .12s,opacity .12s,background-color .12s}
.kara-on .kl{opacity:.45}
.kara-on .kl.lit{opacity:1;color:var(--cobalt);background:var(--cobalt-soft)}
.kbar{position:fixed;left:0;top:0;width:3px;border-radius:2px;background:var(--cobalt);box-shadow:0 0 0 1px var(--surface),0 0 10px var(--cobalt);z-index:4;pointer-events:none;will-change:transform}
@media (prefers-reduced-motion:reduce){.kl{transition:none}}
.theme-btn .sun{display:none}
.theme-btn.is-dark .sun{display:block}
.theme-btn.is-dark .moon{display:none}
.bar{height:8px;border-radius:99px;background:var(--cobalt-soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--cobalt);border-radius:99px}
.muted{color:var(--muted)}
.ru{font-weight:600}
.tr{color:var(--muted);font-size:14.5px;font-style:italic}
.ph{color:var(--muted);font-size:.86em;font-style:italic;font-weight:400;white-space:normal}
.wcard .big{font-family:var(--display);font-size:32px;line-height:1.15}
.wcard .tr{font-size:16px}
.wblock{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.wblock .lbl{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.wblock .ruline{font-size:20px;font-weight:600}
.say-it{display:flex;gap:14px;align-items:center;margin-top:12px}
.field.col{flex-direction:column;align-items:stretch}
.tag{display:inline-block;font-size:13px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--cobalt-soft);color:var(--ink)}
.done-tag{background:var(--good-soft);color:var(--good)}

.hero{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}
.goal{width:92px;height:92px;position:relative}
.goal svg{width:100%;height:100%;transform:rotate(-90deg)}
.goal .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:700;font-size:14px;line-height:1.15}
.plan{list-style:none;margin:0;padding:0;counter-reset:p}
.plan li{counter-increment:p;display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.plan li:last-child{border-bottom:0}
.plan li::before{content:counter(p);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--cobalt-soft);color:var(--cobalt)}
.plan li.ok::before{content:"✓";background:var(--good-soft);color:var(--good)}
.tracks{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.track{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.track .big{font-family:var(--display);font-size:30px;color:var(--cobalt);line-height:1;margin-bottom:8px}

.letters{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;margin-top:10px}
.lt{aspect-ratio:1;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-family:var(--display);font-size:26px;display:grid;place-items:center;position:relative}
.lt.ok{border-color:var(--good);box-shadow:inset 0 0 0 1px var(--good)}
.lt.ok::after{content:"";position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--good)}
.group-note{color:var(--muted);font-size:15px;margin:2px 0 0}
.sheet-wrap{position:fixed;inset:0;z-index:20;background:rgba(8,14,36,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:22px 22px calc(26px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.sheet-wrap{align-items:center}.sheet{border-radius:22px;padding-bottom:26px}}
.letter-big{font-family:var(--display);font-size:88px;line-height:1;color:var(--cobalt)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:16px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}

/* The mic: a Gzhel-style rosette, the one bold element */
.mic{border:0;background:none;padding:0;width:var(--s,104px);height:var(--s,104px);border-radius:50%;flex:none;position:relative}
.mic svg{width:100%;height:100%;display:block}
.mic .disc{fill:var(--cobalt)}
.mic .pet{fill:var(--cobalt-ink);opacity:.28}
.mic .core{fill:var(--cobalt-ink)}
.mic .ic{fill:var(--cobalt)}
.mic .ics{stroke:var(--cobalt);fill:none;stroke-width:3.5;stroke-linecap:round}
.mic .petals{transform-origin:60px 60px}
.mic.on .petals{animation:spin 6s linear infinite}
.mic.on .pet{opacity:.6}
.mic.on::before{content:"";position:absolute;inset:-8px;border-radius:50%;border:3px solid var(--cobalt);opacity:.5;animation:pulse 1.4s ease-out infinite}
.mic:disabled{opacity:.45}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{from{transform:scale(.92);opacity:.6}to{transform:scale(1.12);opacity:0}}
@media (prefers-reduced-motion:reduce){.mic.on .petals,.mic.on::before{animation:none}}
.heard{min-height:24px;font-size:16px;color:var(--muted)}
.score{font-weight:700}
.score.good{color:var(--good)} .score.mid{color:var(--amber)} .score.bad{color:var(--bad)}

.list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.item{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center}
.item .em{font-size:28px;text-align:center}
.item .t{font-weight:600}
.item .s{color:var(--muted);font-size:15px}

table.gt{border-collapse:collapse;width:100%;font-size:16px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.gt td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.gt tr:last-child td{border-bottom:0}
.gt td:first-child{font-weight:600;white-space:nowrap}

.q{font-size:20px;font-weight:600;margin-bottom:14px}
.q .ru{font-size:26px}
.opts{display:grid;gap:10px}
.opt{text-align:left;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-size:17px}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.field{display:flex;gap:8px;align-items:stretch}
.field input{flex:1;min-width:0;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:19px}
.field input:focus{border-color:var(--cobalt);outline:none}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;font-size:16px}
.fb.ok{background:var(--good-soft);color:var(--good)}
.fb.no{background:var(--bad-soft);color:var(--bad)}
.fb.mid{background:var(--amber-soft);color:var(--amber)}
.fb b{color:var(--ink)}
.progress-top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.progress-top .bar{flex:1}

.kbd{margin-top:10px;display:grid;gap:5px;user-select:none}
.kbd .kr{display:flex;gap:4px;justify-content:center}
.kbd button{flex:1;max-width:44px;min-width:0;padding:10px 0;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:17px}
.kbd button.wide{max-width:none;flex:3}

.convo-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.convo-head .em{font-size:34px}
.phase{display:flex;gap:6px;margin:8px 0 18px}
.phase span{flex:1;height:5px;border-radius:9px;background:var(--cobalt-soft)}
.phase span.on{background:var(--cobalt)}
.msgs{display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:12px 15px;border-radius:18px;font-size:17px}
.msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.me{align-self:flex-end;background:var(--cobalt);color:var(--cobalt-ink);border-bottom-right-radius:6px}
.msg .ruline{font-size:20px;font-weight:600;line-height:1.35}
.msg .en{font-size:15px;color:var(--muted);margin-top:4px}
.msg .tools{display:flex;gap:10px;margin-top:8px;align-items:center}
.msg .tools button:not(.icon-btn){background:none;border:0;padding:4px 0;font-size:14px;font-weight:600;color:var(--cobalt)}
.fix{align-self:flex-end;max-width:88%;background:var(--amber-soft);border-radius:14px;padding:10px 13px;font-size:15px}
.fix .better{font-weight:700;font-size:17px}
.typing{color:var(--muted);font-style:italic}
.dock{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom,0px));margin-top:18px;background:var(--bg);padding:12px 0 6px;border-top:1px solid var(--line)}
.dock-in{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.dock-in .l{justify-self:start}
.dock-in .r{justify-self:end}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 11px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--cobalt);color:var(--cobalt-ink)}
.hintbox{background:var(--cobalt-soft);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.phrases{display:grid;gap:10px}
.phrase{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.phrase .ruline{font-size:19px;font-weight:600}
.phrase.ok{border-color:var(--good);box-shadow:inset 0 0 0 1px var(--good)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:15px;z-index:30;max-width:min(92vw,520px);text-align:center}
.recap h3{margin:18px 0 8px}
.recap ul{margin:0;padding-left:20px}
.recap li{margin-bottom:6px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.switch:last-child{border-bottom:0}
.switch input{width:22px;height:22px;accent-color:var(--cobalt);flex:none}
.status{font-size:15px}
.status span:last-child{text-align:right}

.steps{margin:10px 0 0;padding-left:22px}
.steps li{margin-bottom:6px}
a{color:var(--cobalt);font-weight:600}
.msg.me .vo{font-size:14px}
.msg.unclear{opacity:.7;font-style:italic}
.mic.on .disc{fill:var(--bad)}
.mic.on::before{border-color:var(--bad)}
details summary{list-style-position:inside}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <button class="brand" data-go="home" aria-label="Говори home">Говори</button>
  <span class="chip streak" id="streakChip" title="Day streak">🔥 0</span>
  <span class="chip" id="xpChip" title="Total XP">0 XP</span>
  <button class="icon-btn saved-top" data-go="saved" id="savedTop" aria-label="Saved words and phrases" title="Saved"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 3h11a1 1 0 0 1 1 1v17l-6.5-3.8L5.5 21V4a1 1 0 0 1 1-1z"/></svg><span class="badge" id="savedCount" hidden>0</span></button>
  <button class="icon-btn theme-btn" id="themeBtn" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">
    <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 14.5A9 9 0 0 1 9.5 3a9 9 0 1 0 11.5 11.5z"/></svg>
    <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M11 1h2v3h-2zM11 20h2v3h-2zM1 11h3v2H1zM20 11h3v2h-3zM4.2 2.8l2.1 2.1-1.4 1.4-2.1-2.1zM17.7 16.3l2.1 2.1-1.4 1.4-2.1-2.1zM2.8 19.8l2.1-2.1 1.4 1.4-2.1 2.1zM16.3 6.3l2.1-2.1 1.4 1.4-2.1 2.1z"/></svg>
  </button>
</div></header>
<main id="app" tabindex="-1"></main>
<nav class="tabs" aria-label="Sections"><div class="tabs-in">
  <button class="tab" data-go="home"><span class="g">Дом</span>Home</button>
  <button class="tab" data-go="sounds"><span class="g">Аа</span>Sounds</button>
  <button class="tab" data-go="grammar"><span class="g">Я</span>Grammar</button>
  <button class="tab" data-go="talk"><span class="g">Да!</span>Talk</button>
  <button class="tab" data-go="words"><span class="g">Сл</span>Words</button>
  <button class="tab" data-go="sayings"><span class="g">🪆</span>Wisdom</button>
  <button class="tab" data-go="review"><span class="g">↻</span>Review</button>
</div></nav>
<script>
/* Говори: a voice-first Russian practice app. Lesson data first, then the app. */
const LETTERS = [
 {u:'А',l:'а',name:'а',sound:'“a” as in father',word:'мама',mean:'mom',g:'friend'},
 {u:'Б',l:'б',name:'бэ',sound:'“b” as in bat',word:'банк',mean:'bank',g:'new'},
 {u:'В',l:'в',name:'вэ',sound:'“v” as in van (not a B!)',word:'вода',mean:'water',g:'false'},
 {u:'Г',l:'г',name:'гэ',sound:'“g” as in go',word:'город',mean:'city',g:'new'},
 {u:'Д',l:'д',name:'дэ',sound:'“d” as in dog',word:'дом',mean:'house',g:'new'},

function translit(s){
  return String(s || '').replace(/[А-яЁё]/g, ch => {
    const low = ch.toLowerCase(); const t = TR[low] ?? ch;
    return ch !== low && t ? t[0].toUpperCase() + t.slice(1) : t;
  });
}

      if(c==='ъ') continue;

      const hard=prev&&'жшц'.includes(prev), soft=prev&&'чщ'.includes(prev);

      else if(c==='у') v='oo';
      else if(c==='ы') v='ih';
      else if(c==='э') v='e';
      else if(c==='и') v = hard?'ih':'ee';
      else if(c==='ё') v = (hard||soft)?'o':'yo';
      else if(c==='ю') v = hard?'oo':'yoo';
      else if(c==='е') v = stressed||final ? ((hard||soft)?'e':'ye') : (hard?'ih':yStart?'yee':'ee');

const GEMINI_URL = m => `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(m)}:generateContent`;
const CHAT_MODELS = ['gemini-3.8-flash','gemini-3.5-flash-lite','gemini-3.6-flash','gemini-2.5-flash'];

  try{ return JSON.parse(text); }catch(e){}
  const m=String(text).match(/```(?:json)?\s*([\s\S]*?)```/); if(m){ try{ return JSON.parse(m[1]); }catch(e){} }
  const a=text.indexOf('{'), b=text.lastIndexOf('}'); if(a>=0&&b>a){ try{ return JSON.parse(text.slice(a,b+1)); }catch(e){} }

/* contents: Gemini Content[]; returns parsed JSON (or text when json:false). Throws {code, detail}. */
async function gemini({system, contents, json=true, models=CHAT_MODELS, signal, temperature=0.7}){
  const key=getKey(); if(!key) throw {code:'no_key'};
  let lastErr=null;
  for(const model of modelList(models)){
    for(const withThinking of (noThinking.has(model)?[false]:[true,false])){
      const generationConfig={temperature};
      if(json) generationConfig.responseMimeType='application/json';
      if(withThinking) generationConfig.thinkingConfig={thinkingLevel:thinkingFor(model)};
      const body={contents, generationConfig};
      if(system) body.systemInstruction={parts:[{text:system}]};
      let res;
      try{
        res=await fetch(GEMINI_URL(model),{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify(body),signal});
      }catch(e){
        if(e && e.name==='AbortError') throw {code:'cancelled'};
        throw {code:'network', detail:String(e&&e.message||e)};
      }
      if(res.ok){
        const data=await res.json().catch(()=>({}));
        const cand=data.candidates&&data.candidates[0];
        const text=((cand&&cand.content&&cand.content.parts)||[]).filter(p=>!p.thought).map(p=>p.text||'').join('').trim();
        if(!text){ lastErr={code:'empty', detail:(data.promptFeedback&&data.promptFeedback.blockReason)||(cand&&cand.finishReason)||''}; break; }
        if(!json) return text;
        const parsed=parseJSON(text);
        if(parsed==null){ lastErr={code:'bad_json', detail:text.slice(0,200)}; break; }
        return parsed;
      }
      const errBody=await res.json().catch(()=>({}));
      const msg=(errBody.error&&errBody.error.message)||'';
      if(res.status===400 && withThinking && /think/i.test(msg)){ noThinking.add(model); continue; }            // model doesn't take thinkingLevel: retry without
      if(/API key not valid|API_KEY_INVALID|API key expired/i.test(msg) || res.status===401) throw {code:'bad_key', detail:msg};
      if(res.status===403) throw {code:'forbidden', detail:msg};
      if(res.status===404 || /not found|is not supported/i.test(msg)){ missingModels.add(model); lastErr={code:'model_missing', detail:msg}; break; }
      if(res.status===429){ lastErr={code:'rate_limited', detail:msg}; break; }
      if(res.status>=500){ lastErr={code:'server', detail:msg}; break; }
      lastErr={code:'http_'+res.status, detail:msg}; break;
    }
  }
  throw lastErr||{code:'model_missing'};
}

  k.bar.style.transform=`translate(${Math.round((r.left+r.width*x-1.5)*10)/10}px,${Math.round(r.top-3)}px)`;

let curUtter=null, speakToken=0;

    const perWord=karaWrap(el);

      const bar=document.createElement('div'); bar.className='kbar'; bar.setAttribute('aria-hidden','true');
      if(el.closest('.sheet-wrap')) bar.style.zIndex='25';
      document.body.appendChild(bar);
      const first=[]; let n=0; perWord.forEach(ls=>{ first.push(n); n+=ls.length; });

  const u=mkU(text, rate); curUtter=u;
  return new Promise(res=>{
    u.onstart=()=>{ u._t0=performance.now(); if(k){ k.t0=u._t0; k.raf=requestAnimationFrame(frame); } };
    u.onboundary=e=>{
      if(e.name&&e.name!=='word') return;
      let j=0; while(j+1<words.length && words[j+1].i<=e.charIndex) j++;

}

/* ============ Speech in: recording (works on iPhone) ============ */
let rec=null;
const canRecord = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) && !!(window.AudioContext||window.webkitAudioContext);
async function startRecording(onLevel){
  if(!canRecord) throw {code:'no_mic_support'};
  stopSpeech();
  const Ctx=window.AudioContext||window.webkitAudioContext;
  const ctx=new Ctx();                                  // created inside the tap, so iPhone allows it
  try{ await ctx.resume(); }catch(e){}
  let stream;
  try{ stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1}}); }
  catch(e){ try{ctx.close();}catch(_){} throw {code: (e&&(e.name==='NotAllowedError'||e.name==='SecurityError'))?'mic_denied':'mic_error', detail:e&&e.message}; }
  const src=ctx.createMediaStreamSource(stream);
  const proc=ctx.createScriptProcessor(4096,1,1);
  const chunks=[]; let peak=0;
  proc.onaudioprocess=ev=>{
    const d=ev.inputBuffer.getChannelData(0); chunks.push(new Float32Array(d));
    let s=0; for(let i=0;i<d.length;i+=16) s+=d[i]*d[i]; const rms=Math.sqrt(s/(d.length/16)); peak=Math.max(peak,rms);
    onLevel && onLevel(rms);
  };
  src.connect(proc); proc.connect(ctx.destination);
  rec={ctx,stream,src,proc,chunks,rate:ctx.sampleRate,start:Date.now(),get peak(){return peak;}};
  rec.autoStop=setTimeout(()=>{ if(rec && rec.onAuto) rec.onAuto(); }, 30000);
}
async function stopRecording(){
  const r=rec; rec=null; if(!r) return null;
  clearTimeout(r.autoStop);
  try{ r.proc.disconnect(); r.src.disconnect(); }catch(e){}
  r.stream.getTracks().forEach(t=>t.stop());
  try{ await r.ctx.close(); }catch(e){}
  const seconds=(Date.now()-r.start)/1000;
  if(seconds<0.5) return {tooShort:true};

}
function cancelRecording(){ if(rec){ stopRecording(); } }
function encodeWav(chunks, inRate, outRate){
  let total=0; for(const c of chunks) total+=c.length;
  const all=new Float32Array(total); let o=0; for(const c of chunks){ all.set(c,o); o+=c.length; }
  const ratio=inRate/outRate, outLen=Math.floor(all.length/ratio), pcm=new Int16Array(outLen);
  for(let i=0;i<outLen;i++){
    const s=Math.floor(i*ratio), e=Math.min(Math.floor((i+1)*ratio), all.length);
    let sum=0; for(let j=s;j<e;j++) sum+=all[j]; const v=sum/Math.max(1,e-s);

  const w=(p,s)=>{ for(let i=0;i<s.length;i++) dv.setUint8(p+i,s.charCodeAt(i)); };
  w(0,'RIFF'); dv.setUint32(4,36+pcm.length*2,true); w(8,'WAVE'); w(12,'fmt ');
  dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,1,true); dv.setUint32(24,outRate,true);
  dv.setUint32(28,outRate*2,true); dv.setUint16(32,2,true); dv.setUint16(34,16,true); w(36,'data'); dv.setUint32(40,pcm.length*2,true);

/* Browser speech recognition: free and instant on Chrome; used for short pronunciation checks when available */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function useBrowserSR(){ if(state.checker==='ai') return false; if(state.checker==='browser') return !!SR; return !!SR && !isIOS; }
let activeSR=null;
function listenSR(onInterim){
  return new Promise(resolve=>{
    stopSpeech();
    const r=new SR(); r.lang='ru-RU'; r.interimResults=true; r.maxAlternatives=4; r.continuous=false;
    let finalText='', alts=[], err=null;
    r.onresult=e=>{ let interim=''; for(let i=e.resultIndex;i<e.results.length;i++){ const res=e.results[i]; if(res.isFinal){ finalText+=res[0].transcript; alts=[...res].map(a=>a.transcript);} else interim+=res[0].transcript; } onInterim&&onInterim((finalText+interim).trim()); };
    r.onerror=e=>{ err=e.error; };

/* Pronunciation check for one target phrase. Returns score 0..1 or null. */
async function sayCheck(btn, target, out){
  if(btn.classList.contains('on')){
    if(activeSR){ try{activeSR.stop();}catch(e){} return null; }
    if(rec){ btn._stop && btn._stop(); return null; }
    return null;
  }
  if(useBrowserSR()){
    btn.classList.add('on'); out.innerHTML='<span class="muted">Listening…</span>';
    const res=await listenSR(t=>{ out.innerHTML=`<span class="muted">Heard:</span> ${esc(t)}`; });
    btn.classList.remove('on');
    if(res.err==='not-allowed'||res.err==='service-not-allowed'){ out.innerHTML=`<span class="score bad">${esc(micDeniedCopy())}</span>`; return null; }
    if(!res.text){ out.innerHTML='<span class="muted">I didn’t hear anything. Tap the mic and try again.</span>'; return null; }
    const best=Math.max(...res.alts.map(a=>sim(a,target)));
    showScore(out, best, res.text, '');
    return best;
  }
  // AI check: record, then let Gemini listen
  try{ await startRecording(); }catch(e){ out.innerHTML=`<span class="score bad">${esc(e.code==='mic_denied'?micDeniedCopy():'The microphone couldn’t start. '+(e.detail||''))}</span>`; return null; }
  btn.classList.add('on'); out.innerHTML='<span class="muted">Recording… tap the mic again when you’re done.</span>';
  const done = await new Promise(res=>{ btn._stop=()=>res(true); rec.onAuto=()=>res(true); });
  btn._stop=null; btn.classList.remove('on');
  const clip=await stopRecording();
  if(!clip || clip.tooShort){ out.innerHTML='<span class="muted">That was too short. Tap, speak, then tap again.</span>'; return null; }
  if(clip.silent){ out.innerHTML='<span class="muted">I didn’t hear anything. Check that your mic isn’t muted.</span>'; return null; }
  btn.disabled=true; out.innerHTML='<span class="muted">Checking…</span>';
  try{
    const r=await gemini({models:QUICK_MODELS, temperature:0.2, contents:[{role:'user',parts:[
      {text:`An English-speaking beginner is practicing Russian pronunciation. They tried to say: "${target}". Listen to the attached recording.
Reply with ONLY JSON: {"heard":"what they actually said, written in Cyrillic","score":0-100,"tip":"one short, specific English tip about the sound they got most wrong, or an empty string if it was good"}
Score honestly but kindly: 85+ means a Russian would understand it easily; 60-84 understandable with effort; under 60 hard to understand. Judge sounds, not accent.`},
      {inlineData:{mimeType:'audio/wav', data:clip.base64}}]}]});
    const score=Math.max(0,Math.min(100,Number(r.score)||0))/100;
    showScore(out, score, String(r.heard||''), String(r.tip||''));
    return score;
  }catch(e){ out.innerHTML=`<span class="score bad">${esc(errCopy(e))}</span>`; return null; }
  finally{ btn.disabled=false; }
}
function showScore(out, best, heard, tip){
  const cls = best>=0.8?'good':best>=0.6?'mid':'bad';
  const word = best>=0.8?'Great':best>=0.6?'Close. Listen again and repeat':'Not quite. Play it and try again';
  out.innerHTML = `<span class="score ${cls}">${word} (${Math.round(best*100)}%)</span>${heard?`<br><span class="muted">Heard:</span> <span lang="ru">${esc(heard)}</span>`:''}${tip?`<br><span class="muted">Tip:</span> ${esc(tip)}`:''}`;
}

/* Pronunciation guide everywhere: after anything renders, put [pree-VYET] after Russian text
   that doesn't already have its own guide line (.tr) next to it. */
const PH_SKIP='.kw,.say-pair,.kl,.ph,.tr,[data-noph],input,textarea,select,script,style,svg,.kbd,.lt,.letter-big,nav,header';
const PH_RUN=/[А-яЁё\u0301]+(?:[\s,.!?…—–-]+[А-яЁё\u0301]+)*[!?.…]?/g;
function hasOwnGuide(el){ for(let n=el,d=0;n&&d<3;n=n.parentElement,d++){ if(n.nextElementSibling&&n.nextElementSibling.classList.contains('tr')) return true; if(n.querySelector(':scope > .tr')) return true; } return false; }
function annotateRu(root){
  if(!state.translit || !root.closest || !root.closest('#app,.sheet-wrap')) return;
  const nodes=[], tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  if(root.nodeType===3) nodes.push(root);
  while(tw.nextNode()) nodes.push(tw.currentNode);
  for(const n of nodes){
    const el=n.parentElement;
    if(!el || !/[А-яЁё]/.test(n.nodeValue) || el.closest(PH_SKIP) || hasOwnGuide(el)) continue;
    if(n.nextSibling && n.nextSibling.nodeType===1 && n.nextSibling.classList.contains('ph')) continue;
    const text=n.nodeValue, frag=document.createDocumentFragment(); let last=0, m;
    PH_RUN.lastIndex=0;
    while((m=PH_RUN.exec(text))){
      const end=m.index+m[0].length;
      frag.append(text.slice(last,end));
      const sp=document.createElement('span'); sp.className='ph'; sp.textContent=' ['+phon(m[0]).replace(/[.!?…]+$/,'')+']';
      frag.append(sp); last=end;
    }
    frag.append(text.slice(last));
    n.replaceWith(frag);
  }
}
const phObs=new MutationObserver(recs=>{
  phObs.disconnect();
  for(const r of recs) for(const n of r.addedNodes){ if(n.nodeType===1) annotateRu(n); else if(n.nodeType===3&&n.parentElement) annotateRu(n.parentElement); }
  phObs.observe(document.body,{childList:true,subtree:true});
});

function closeSheet(){ const s=$('.sheet-wrap'); if(s){ cancelRecording(); if(activeSR){try{activeSR.stop();}catch(e){}} s.remove(); } }
function closeSheetToSounds(){ closeSheet(); if((location.hash||'')==='#sounds') renderSounds(); }
function sheet(html){
  closeSheet();
  const w=document.createElement('div'); w.className='sheet-wrap'; w.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  w.addEventListener('click',e=>{ if(e.target===w) closeSheetToSounds(); });
  document.body.appendChild(w); return $('.sheet',w);
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && $('.sheet-wrap')) closeSheetToSounds(); });
function openLetter(i){
  const L=LETTERS[i];
  const sh=sheet(`
    <div class="row" style="justify-content:space-between;align-items:flex-start">
      <div class="letter-big">${L.u}${L.l}</div>
      <button class="btn quiet small" id="closeL">Close</button>
    </div>
    <dl class="kv" style="margin:16px 0">
      <dt>Name</dt><dd><span class="ru">${L.name}</span></dd>
      <dt>Sound</dt><dd>${L.sound}</dd>
      <dt>Example</dt><dd><span class="ru" style="font-size:22px">${L.word}</span> <span class="tr">${phon(L.word)}</span><br>${L.mean}</dd>
    </dl>
    <div class="row">${playBtn(L.name,'Hear the letter')}<span>Letter</span>${playBtn(L.word,'Hear the word',false,L.mean)}<span>Word</span></div>
    <div class="panel" style="margin-top:16px;display:flex;gap:16px;align-items:center">
      ${micBtn('lMic',84,'Say the example word')}
      <div><div style="font-weight:600">Say “${L.word}”</div><div class="heard" id="lOut">Tap the mic and say it out loud.</div></div>
    </div>
    <div class="row" style="justify-content:space-between;margin-top:16px">
      <button class="btn ghost small" id="prevL" ${i===0?'disabled':''}>Previous</button>
      <button class="btn small" id="nextL" ${i===32?'disabled':''}>Next letter</button>
    </div>`);
  speak(L.word);
  $('#closeL',sh).onclick=closeSheetToSounds;
  $('#prevL',sh).onclick=()=>openLetter(i-1);
  $('#nextL',sh).onclick=()=>openLetter(i+1);
  $('#lMic',sh).onclick=async e=>{
    const score=await sayCheck(e.currentTarget, L.word, $('#lOut',sh));
    if(score!=null && score>=0.8 && !state.letters[L.u]){ state.letters[L.u]=1; addXP(2); toast('+2 XP. '+L.u+' is done.'); }
  };
}
function openQuiz(){
  let n=0, right=0;
  const ask=()=>{
    if(n===8){ const sh=sheet(`<h2>Quiz done</h2><p>${right} of 8 right. +${right} XP.</p><button class="btn" id="qClose">Back to the sound lab</button>`); addXP(right); $('#qClose',sh).onclick=closeSheetToSounds; return; }
    let L; do{ L=LETTERS[Math.floor(Math.random()*33)]; } while(L.g==='sign');
    const pool=shuffle(LETTERS.filter(x=>x.u!==L.u&&x.g!=='sign')).slice(0,3);
    const opts=shuffle([L,...pool]);
    const target=L.u==='Й'?'йогурт':L.word;
    const qText = L.u==='Ы' ? 'Which letter makes the vowel sound in this word?' : 'Which letter does this word start with?';
    const sh=sheet(`<div class="progress-top"><div class="bar"><i style="width:${n/8*100}%"></i></div><button class="btn quiet small" id="qX">Close</button></div>
      <div class="q">${qText}</div><div class="row" style="margin-bottom:16px">${playBtn(target,'Play the word again')}<span class="muted">Play again</span></div>
      <div class="opts" style="grid-template-columns:repeat(2,1fr)">${opts.map(o=>`<button class="opt" data-noph style="font-family:var(--display);font-size:30px;text-align:center" data-u="${o.u}">${o.u}${o.l}</button>`).join('')}</div><div id="qfb"></div>`);
    speak(target);
    $('#qX',sh).onclick=closeSheetToSounds;
    $$('[data-u]',sh).forEach(b=>b.onclick=()=>{
      $$('[data-u]',sh).forEach(x=>{x.disabled=true; if(x.dataset.u===L.u) x.classList.add('right');});
      const ok=b.dataset.u===L.u; if(ok) right++; else b.classList.add('wrong');
      $('#qfb',sh).innerHTML=`<div class="fb ${ok?'ok':'no'}">${ok?'Right.':'It was '+L.u+'.'} <b>${target}</b> <span class="tr">${phon(target)}</span></div><button class="btn" style="margin-top:12px" id="qNext">Next</button>`;
      $('#qNext',sh).onclick=()=>{n++;ask();};
    });
  };
  ask();
}

function sayable(t){ return /[А-яЁё]/.test(t) ? playBtn(t.replace(/\(.*?\)/g,'').replace(/[:→]/g,' '),'Play',true) : ''; }
function openLesson(id){
  const L=LESSONS.find(x=>x.id===id);
  app.innerHTML=`<button class="btn quiet small" data-go="grammar">All lessons</button>
  <h1 style="margin-top:16px">${L.emoji} ${esc(L.title)}</h1>
  <div class="stack" style="margin-top:14px">${L.explain}
    <div class="tw"><table class="gt">${L.table.map(r=>`<tr><td>${sayable(r[0])}${esc(r[0])}</td><td>${sayable(r[1])}${esc(r[1])}</td></tr>`).join('')}</table></div>
  </div>
  <section class="section panel" id="drillBox"></section>`;
  runGrammarDrills(L, $('#drillBox'));
  window.scrollTo(0,0);
}
function runGrammarDrills(L, box){
  let i=0, right=0;
  const next=()=>{
    if(i===L.drills.length){
      const first=!state.grammar[L.id]; state.grammar[L.id]=1; addXP(first?10:3);
      box.innerHTML=`<h2>Lesson done</h2><p>${right} of ${L.drills.length} right. ${first?'+10 XP.':'+3 XP.'}</p>
      <p class="muted">Now lock it in. Your AI partner will steer a short chat toward this exact pattern.</p>
      <div class="row"><button class="btn" id="practice">Use it in a conversation</button><button class="btn ghost" data-go="grammar">Back to lessons</button></div>`;
      $('#practice').onclick=()=>startSession({id:'g-'+L.id, emoji:L.emoji, title:'Practice: '+L.title, ru:L.ru, persona:'Лена, a patient Russian tutor having a casual chat', goal:'Use this pattern in real sentences: '+L.title.toLowerCase()+'.', focus:L.focus, phrases:null});
      return;
    }
    const d=L.drills[i];
    box.innerHTML=`<div class="progress-top"><div class="bar"><i style="width:${i/L.drills.length*100}%"></i></div><span class="muted">${i+1}/${L.drills.length}</span></div>
      <div class="q">${d.q}</div>
      ${d.t==='mc'?`<div class="opts">${d.o.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join('')}</div>`
        :`<div class="field"><input id="gIn" autocomplete="off" autocapitalize="off" spellcheck="false" lang="ru" placeholder="Type in Russian">${KBD_TOGGLE}<button class="btn" id="gCheck">Check</button></div>${kbdHTML()}`}
      <div id="gfb"></div>`;
    const finish=(ok,ans)=>{ if(ok) right++; const isRu=/[А-яЁё]/.test(ans); $('#gfb',box).innerHTML=`<div class="fb ${ok?'ok':'no'}">${ok?'Correct.':'Answer:'} <b>${esc(ans)}</b> ${isRu?`<span class="tr">${phon(ans)}</span>`:''}</div><button class="btn" style="margin-top:12px" id="gNext">Continue</button>`; if(isRu) speak(ans); const nb=$('#gNext',box); nb.onclick=()=>{i++;next();}; };
    if(d.t==='mc'){
      $$('[data-k]',box).forEach(b=>b.onclick=()=>{ $$('[data-k]',box).forEach(x=>{x.disabled=true; if(+x.dataset.k===d.a) x.classList.add('right');}); const ok=+b.dataset.k===d.a; if(!ok) b.classList.add('wrong'); finish(ok,d.o[d.a]); });
    } else {
      const inp=$('#gIn',box); bindKbd(box,inp);
      const check=()=>{ if(!inp.value.trim()) return; const r=checkTyped(inp.value,d.a); inp.disabled=true; $('#gCheck',box).disabled=true; const ok=r.score>=0.9; finish(ok,d.a[0]); if(ok&&r.latin) toast('Correct in Latin letters. Try the АБВ keyboard next time.'); };
      $('#gCheck',box).onclick=check; inp.onkeydown=e=>{ if(e.key==='Enter') check(); };
    }
  };
  next();
}

/* ============ Conversation session ============ */
function startSession(sc){
  endSessionAudio();
  session={sc, phase: sc.phrases?'warmup':'chat', said:{}, messages:[], history:[], pending:null, learnerTurns:0, busy:false, error:null, showHint:false, typing:false, draft:'', recap:null, recapErr:null, started:false, recording:false};
  if(location.hash!=='#talk') location.hash='talk'; else { renderSession(); window.scrollTo(0,0); }
}
function phaseBar(){ const ps=session.sc.phrases?['warmup','chat','recap','review']:['chat','recap','review']; const idx=ps.indexOf(session.phase); return `<div class="phase" aria-hidden="true">${ps.map((p,i)=>`<span class="${i<=idx?'on':''}"></span>`).join('')}</div>`; }
function sessionHead(){ const s=session.sc; return `<div class="convo-head"><span class="em">${s.emoji}</span><div style="flex:1"><h2 style="margin:0">${esc(s.title)}</h2><div class="muted" style="font-size:15px">${esc(s.goal)}</div></div><button class="btn quiet small" id="leave">Leave</button></div>${phaseBar()}`; }
function bindLeave(){ const lv=$('#leave'); if(lv) lv.onclick=()=>{ endSessionAudio(); session=null; renderTalk(); window.scrollTo(0,0); }; }
function renderSession(){
  if(!session) return renderTalk();
  if(session.phase==='warmup') renderWarmup();
  else if(session.phase==='chat') renderChat();
  else if(session.phase==='recap') renderRecap();
  else renderSessionReview();
}
function renderWarmup(){
  const s=session.sc;
  app.innerHTML=`${sessionHead()}
  <h3>Warm-up: key phrases</h3>
  <p class="muted" style="margin:6px 0 14px">Tap play to hear each one, then the mic to say it. You don’t need all six; three good ones is plenty.</p>
  <div class="phrases">${s.phrases.map((p,i)=>`<div class="phrase ${session.said[i]?'ok':''}" id="ph${i}"><div><div class="ruline" lang="ru">${esc(p[0])}</div>${state.translit?`<div class="tr">${esc(phon(p[0]))}</div>`:''}<div class="muted" style="font-size:15px">${esc(p[1])}</div><div class="heard" id="phOut${i}"></div></div>${playBtn(p[0],'Play',false,p[1])}${micBtn('phMic'+i,46,'Say this phrase')}</div>`).join('')}</div>
  <div class="row" style="margin-top:20px"><button class="btn" id="toChat">Start the conversation</button></div>`;
  bindLeave();
  s.phrases.forEach((p,i)=>{ $('#phMic'+i).onclick=async e=>{ const sc=await sayCheck(e.currentTarget,p[0].replace(/…/g,''),$('#phOut'+i)); if(sc!=null&&sc>=0.7&&session){ session.said[i]=1; $('#ph'+i).classList.add('ok'); } }; });
  $('#toChat').onclick=()=>{ cancelRecording(); addWords(s.phrases.map(p=>({ru:p[0].replace(/…/g,'').trim(),en:p[1]}))); const n=Object.keys(session.said).length; if(n) addXP(n); session.phase='chat'; renderSession(); window.scrollTo(0,0); };
}
function rulesFor(sc){
  return `You are ${sc.persona}, the conversation partner in a Russian speaking-practice app. The learner is an English-speaking adult beginner (CEFR A1) who knows the Cyrillic alphabet and a few basic words.
Scenario: ${sc.title} (${sc.ru}). Learner’s goal: ${sc.goal}${sc.focus?`\nGrammar focus: steer the chat so the learner has to use ${sc.focus}. Ask questions that require this pattern.`:''}${sc.phrases?`\nKey phrases they just warmed up with: ${sc.phrases.map(p=>p[0]).join(' / ')}`:''}

How to talk:
- Stay in character and speak ONLY simple Russian: 1 or 2 short sentences, about 12 words max, everyday words, present tense unless the scenario needs past.
- Keep it moving: end most turns with one easy question.
- The learner often SPEAKS: their reply arrives as an audio recording. Write exactly what they said in "heard" (Cyrillic for Russian, Latin letters for English). If you can't make out any speech, set "heard" to "" and kindly ask them in simple Russian to repeat.
- If the learner speaks or types English, or seems stuck, reply kindly in simple Russian and put the Russian they wanted in "suggest".
- If the learner’s Russian has a real mistake (wrong ending, wrong word, word order that breaks meaning), keep the conversation going but fill "fix". Otherwise "fix" is null. Don’t nitpick.
- If a recording has a clearly mispronounced sound, put one short English tip in "pron"; otherwise null.
- After roughly 8 learner turns, or when the scenario goal is met, wrap up warmly and set "done" to true.

Every reply is ONLY a JSON object:
{"heard":"exact words of the learner's latest turn, or empty for your opening line","ru":"your line in Russian","en":"English translation of your line","suggest":"one short, simple Russian reply the learner could say next","suggest_en":"its English meaning","fix":null or {"you_said":"...","better":"corrected Russian","why":"one short English sentence"},"pron":null or "tip","done":false}`;
}
async function aiTurn(){
  const me=session; if(!me) return;
  me.busy=true; me.error=null; renderChat();
  const ctl=new AbortController(); me.ctl=ctl;
  const contents=[{role:'user',parts:[{text:'Start the conversation now with your opening line.'}]}, ...me.history.slice(-16)];
  if(me.pending) contents.push(me.pending.content);
  try{
    const r=await gemini({system:rulesFor(me.sc), contents, signal:ctl.signal});
    if(session!==me) return;
    const ru=String(r&&r.ru||'').trim(); if(!ru) throw {code:'bad_json'};
    if(me.pending){
      const p=me.pending; me.pending=null;
      let text=p.text;
      if(p.audio){ text=String(r.heard||'').trim(); }
      if(text){
        const isEn=!/[А-яЁё]/.test(text);
        const msg={who:'me',text,en:isEn,voice:!!p.audio};
        if(r.fix && r.fix.better && norm(r.fix.better)!==norm(text)) msg.fix={better:String(r.fix.better), why:String(r.fix.why||'')};
        if(r.pron) msg.pron=String(r.pron);
        me.messages.push(msg); me.learnerTurns++;
        me.history.push({role:'user',parts:[{text:`Learner ${p.audio?'said':'typed'}${isEn?' (in English, wants help saying it in Russian)':''}: ${text}`}]});
      } else {
        me.messages.push({who:'me',text:'(couldn’t make that out)',en:true,voice:true,unclear:true});
        me.history.push({role:'user',parts:[{text:'Learner said something that could not be understood.'}]});
      }
    }
    const clean={ru,en:String(r.en||''),suggest:String(r.suggest||''),suggest_en:String(r.suggest_en||''),done:!!r.done};
    me.history.push({role:'model',parts:[{text:JSON.stringify(clean)}]});
    me.messages.push({who:'ai',...clean});
    if(r.done) me.done=true;
    me.busy=false; me.showHint=false; renderChat(); speak(ru);
  }catch(e){
    if(session!==me) return;
    me.busy=false;
    if(e && e.code==='cancelled'){ renderChat(); return; }
    me.error=e; renderChat();
  }
}
function sendTyped(text){
  text=String(text||'').trim(); if(!text||!session||session.busy) return;
  session.pending={text, content:{role:'user',parts:[{text:`Learner typed: ${text}`}]}};
  session.draft='';
  aiTurn();
}
function sendAudio(clip){
  if(!session||session.busy) return;
  session.pending={audio:true, content:{role:'user',parts:[{text:'The learner’s spoken reply is in this recording. Transcribe it into "heard", then answer in character.'},{inlineData:{mimeType:'audio/wav',data:clip.base64}}]}};
  aiTurn();
}
function renderChat(){
  if(!session) return;

  const lastAi=[...session.messages].reverse().find(m=>m.who==='ai');
  const canFinish = session.learnerTurns>=3;

  app.innerHTML=`${sessionHead()}
  <div class="msgs" id="msgs" aria-live="polite">${session.messages.map((m,i)=> m.who==='ai'
    ? `<div class="msg ai"><div class="ruline" lang="ru">${esc(m.ru)}</div>${state.translit?`<div class="tr">${esc(phon(m.ru))}</div>`:''}<div class="en" ${m.showEn?'':'hidden'} id="en${i}">${esc(m.en)}</div><div class="tools">${playBtn(m.ru,'Play again',false,m.en)}<button data-en="${i}">${m.showEn?'Hide':'Show'} English</button></div></div>`
    : `<div class="msg me ${m.unclear?'unclear':''}" ${m.en?'':'lang="ru"'}>${m.voice?'<span class="vo" aria-label="spoken">🎙️</span> ':''}${esc(m.text)}${m.en&&!m.unclear?'<div style="font-size:13px;opacity:.8;margin-top:3px">in English</div>':''}</div>${m.fix?`<div class="fix"><div class="muted" style="font-size:13px">Better</div><div class="row" style="gap:10px"><span class="better" lang="ru">${esc(m.fix.better)}</span>${playBtn(m.fix.better,'Hear the correction')}</div>${m.fix.why?`<div>${esc(m.fix.why)}</div>`:''}</div>`:''}${m.pron?`<div class="fix"><div class="muted" style="font-size:13px">Pronunciation</div><div>${esc(m.pron)}</div></div>`:''}`).join('')}
    ${session.busy?`<div class="msg ai typing">${session.pending&&session.pending.audio?'Listening to you…':'Thinking…'}</div>`:''}
    ${session.error?`<div class="fb no">${esc(errCopy(session.error))}${retryable?' <button class="btn small" id="retry" style="margin-left:6px">Retry</button>':''}${['no_key','bad_key'].includes(session.error.code)?' <button class="btn small" data-go="settings" style="margin-left:6px">Open Settings</button>':''}</div>`:''}
  </div>
  ${session.done||session.learnerTurns>=10?`<div class="panel" style="margin-top:16px;text-align:center"><p style="margin-bottom:10px"><b>Nice work.</b> That’s a full conversation.</p><button class="btn" id="finish2">See my recap</button></div>`:''}
  <div class="dock">
    ${session.showHint&&lastAi&&lastAi.suggest?`<div class="hintbox"><div class="muted" style="font-size:13px">You could say</div><div class="row" style="gap:10px"><span style="font-size:19px;font-weight:600" lang="ru">${esc(lastAi.suggest)}</span>${playBtn(lastAi.suggest,'Hear the hint',false,lastAi.suggest_en)}</div>${state.translit?`<div class="tr">${esc(phon(lastAi.suggest))}</div>`:''}<div class="muted" style="font-size:15px">${esc(lastAi.suggest_en)}</div></div>`:''}
    <div id="live" class="heard" style="text-align:center;margin-bottom:6px">${session.recording?'Recording… tap to send':'Tap the mic, speak in Russian or English, tap again to send'}</div>
    <div class="dock-in">
      <div class="l" style="display:grid;gap:8px"><button class="btn quiet small" id="hint" ${lastAi&&lastAi.suggest?'':'disabled'}>${session.showHint?'Hide hint':'Hint'}</button></div>
      ${micBtn('talkMic',96,'Record your reply')}
      <div class="r" style="display:grid;gap:8px;justify-items:end">
        <button class="btn quiet small" id="typeTog" aria-pressed="${session.typing}">${session.typing?'Hide typing':'Type'}</button>
        <button class="btn ghost small" id="finish" ${canFinish?'':'disabled'} title="${canFinish?'':'Have at least 3 exchanges first'}">Finish</button>
      </div>
    </div>
    ${session.typing?`<div class="field" style="margin-top:12px"><input id="chatIn" autocomplete="off" spellcheck="false" placeholder="Type in Russian or English" value="${esc(session.draft)}">${KBD_TOGGLE}<button class="btn" id="send">Send</button></div>${kbdHTML()}`:''}
  </div>`;
  bindLeave();
  requestAnimationFrame(()=>window.scrollTo({top:document.body.scrollHeight}));
  $$('[data-en]').forEach(b=>b.onclick=()=>{ const m=session.messages[+b.dataset.en]; m.showEn=!m.showEn; $('#en'+b.dataset.en).hidden=!m.showEn; b.textContent=(m.showEn?'Hide':'Show')+' English'; });
  const hb=$('#hint'); if(hb) hb.onclick=()=>{ session.showHint=!session.showHint; renderChat(); };
  $('#typeTog').onclick=()=>{ session.typing=!session.typing; renderChat(); if(session.typing) $('#chatIn')?.focus(); };
  const fin=()=>{ endSessionAudio(); session.recording=false; session.phase='recap'; renderSession(); window.scrollTo(0,0); };
  $('#finish').onclick=fin; const f2=$('#finish2'); if(f2) f2.onclick=fin;
  const rt=$('#retry'); if(rt) rt.onclick=()=>aiTurn();
  const mic=$('#talkMic'); mic.disabled=session.busy;
  if(session.recording) mic.classList.add('on');
  mic.onclick=async()=>{
    const me=session;
    if(me.recording){
      me.recording=false; mic.classList.remove('on');
      const clip=await stopRecording();
      if(!clip||clip.tooShort){ toast('That was too short. Tap, speak, then tap again.'); renderChat(); return; }
      if(clip.silent){ toast('I didn’t hear anything. Check that your mic isn’t muted.'); renderChat(); return; }
      sendAudio(clip); return;
    }
    try{
      await startRecording(lvl=>{ mic.style.setProperty('--lvl', Math.min(1,lvl*8).toFixed(2)); });
      if(session!==me){ cancelRecording(); return; }
      me.recording=true; mic.classList.add('on'); $('#live').textContent='Recording… tap to send';
      rec.onAuto=()=>{ if(me.recording) mic.click(); };
    }catch(e){
      toast(e.code==='mic_denied'?micDeniedCopy():'The microphone couldn’t start. You can type instead.', 7000);
      if(!me.typing){ me.typing=true; renderChat(); }
    }
  };
  if(session.typing){
    const inp=$('#chatIn'); bindKbd($('.dock'),inp);
    inp.oninput=()=>{session.draft=inp.value;};
    const send=()=>sendTyped(inp.value);
    $('#send').onclick=send; inp.onkeydown=e=>{ if(e.key==='Enter') send(); };
  }
}
async function renderRecap(){
  const me=session, s=me.sc;
  app.innerHTML=`${sessionHead()}<div class="recap"><h2>Your recap</h2><div id="recapBody"><p class="muted">Reading back through your conversation…</p></div></div>`;
  bindLeave();
  const spoken=me.messages.filter(m=>m.who==='me'&&!m.unclear);
  if(!me.recap && !me.recapErr){
    if(!spoken.length){ me.recapErr={code:'nothing'}; }
    else{
      const transcript=me.messages.map(m=>m.who==='ai'?`Partner: ${m.ru}`:`Learner${m.voice?' (spoken)':' (typed)'}${m.en?' (English)':''}: ${m.text}`).join('\n');
      const prompt=`You are a supportive Russian tutor reviewing a short role-play by an English-speaking A1 beginner. Spoken lines were transcribed from audio, so ignore punctuation and capitalization.
Scenario: ${s.title}. Goal: ${s.goal}

Transcript:
${transcript.slice(-12000)}

Reply with ONLY a JSON object:
{"summary":"1-2 encouraging, specific sentences in plain English",
"wins":["up to 3 short things they did well"],
"mistakes":[{"you_said":"...","better":"correct Russian","why":"one short plain-English reason"}],
"pronunciation":["up to 3 short tips about sounds in words they used that English speakers often get wrong"],
"words":[{"ru":"Russian word or short phrase from this conversation","en":"English"}]}
Give at most 5 mistakes (only real ones) and 6 to 8 useful words.`;
      try{ me.recap=await gemini({contents:[{role:'user',parts:[{text:prompt}]}], temperature:0.4}); }catch(e){ me.recapErr=e; }
    }
    if(session!==me || me.phase!=='recap') return;
  }
  const r=me.recap||{};
  const words=(Array.isArray(r.words)?r.words:[]).filter(w=>w&&w.ru&&w.en).slice(0,8);
  me.reviewWords = words.length ? words : (s.phrases||SCENARIOS[0].phrases).map(p=>({ru:p[0].replace(/…/g,'').trim(),en:p[1]}));
  const mistakes=Array.isArray(r.mistakes)?r.mistakes.filter(m=>m&&m.better):[];
  const body=$('#recapBody');
  body.innerHTML = me.recapErr ? `<p class="muted">${me.recapErr.code==='nothing'?'You didn’t say anything this time, so there’s nothing to grade.':esc(errCopy(me.recapErr))}</p><p>You can still do the quick review below.</p>` : `
    <p>${esc(r.summary||'')}</p>
    ${Array.isArray(r.wins)&&r.wins.length?`<h3>What went well</h3><ul>${r.wins.map(w=>`<li>${esc(w)}</li>`).join('')}</ul>`:''}
    <h3>Fix these</h3>${mistakes.length?mistakes.map(m=>`<div class="fix" style="max-width:none;margin-bottom:10px"><div class="muted" style="font-size:14px">You said: <span lang="ru">${esc(m.you_said||'')}</span></div><div class="row" style="gap:10px"><span class="better" lang="ru">${esc(m.better)}</span>${playBtn(m.better)}</div>${state.translit?`<div class="tr">${esc(phon(m.better))}</div>`:''}<div>${esc(m.why||'')}</div></div>`).join(''):'<p class="muted">No real mistakes this time.</p>'}
    ${Array.isArray(r.pronunciation)&&r.pronunciation.length?`<h3>Pronunciation</h3><ul>${r.pronunciation.map(w=>`<li>${esc(w)}</li>`).join('')}</ul>`:''}`;
  body.insertAdjacentHTML('beforeend', `<h3>Words going into your review deck</h3><div class="phrases">${me.reviewWords.map(w=>`<div class="phrase" style="grid-template-columns:1fr auto"><div><span class="ruline" lang="ru">${esc(w.ru)}</span>${state.translit?` <span class="tr">${esc(phon(w.ru))}</span>`:''}<div class="muted" style="font-size:15px">${esc(w.en)}</div></div>${playBtn(w.ru,'Play',false,w.en)}</div>`).join('')}</div>
    <div class="row" style="margin-top:22px"><button class="btn" id="toReview">Start the quick review</button>${me.recapErr&&me.recapErr.code!=='nothing'?'<button class="btn ghost" id="recapRetry">Try the recap again</button>':''}</div>`);
  $('#toReview').onclick=()=>{ me.phase='review'; renderSession(); window.scrollTo(0,0); };
  const rr=$('#recapRetry'); if(rr) rr.onclick=()=>{ me.recapErr=null; renderRecap(); };
}
function buildItems(words, n){
  if(!words.length) return [];
  const types = ['listen','produce','recognize','speak'];
  const pool=shuffle(words); const items=[];
  const count=Math.min(n, pool.length*2);
  for(let i=0;i<count;i++){ items.push({...pool[i%pool.length], type:types[i%types.length]}); }
  return shuffle(items);
}
function renderSessionReview(){
  const me=session, words=me.reviewWords||[];
  app.innerHTML=`${sessionHead()}<section class="panel" id="drill"></section>`;
  bindLeave();
  runDrills($('#drill'), buildItems(words,6), words, (right,total)=>{
    const id=me.sc.id, scored=!id.startsWith('g-')&&id!=='free';
    const first=scored && !state.talks[id]; if(scored) state.talks[id]=1;
    const added=addWords(words); const xp=(first?15:6)+right; addXP(xp);
    $('#drill').innerHTML=`<h2>Conversation complete</h2><p>${right} of ${total} in the review. +${xp} XP. ${added?added+' new words added to your deck.':''}</p><div class="row"><button class="btn" id="again">Talk again</button><button class="btn ghost" data-go="talk">More conversations</button></div>`;
    $('#again').onclick=()=>startSession(me.sc);
  });
}

/* ============ Drill engine ============ */
function runDrills(box, items, deck, onDone, onGrade){
  let i=0, right=0;
  const enPool=[...new Set([...deck.map(w=>w.en), ...SCENARIOS.flatMap(s=>s.phrases.map(p=>p[1]))])];
  const next=()=>{
    if(i>=items.length){ onDone(right,items.length); return; }
    const it=items[i];
    let body='';
    if(it.type==='listen') body=`<div class="q">Listen and type what you hear</div><div class="row" style="margin-bottom:14px">${playBtn(it.ru,'Play')}</div>`;
    if(it.type==='produce') body=`<div class="q">How do you say <span style="color:var(--cobalt)">“${esc(it.en)}”</span>?</div>`;
    if(it.type==='recognize'){ const opts=shuffle([it.en,...shuffle(enPool.filter(e=>e!==it.en)).slice(0,3)]); body=`<div class="q">What does this mean?</div><div class="row" style="margin-bottom:14px"><span class="ru" style="font-size:26px" lang="ru">${esc(it.ru)}</span>${playBtn(it.ru)}</div><div class="opts">${opts.map(o=>`<button class="opt" data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div>`; }
    if(it.type==='speak') body=`<div class="q">Say this out loud</div><div class="row" style="margin-bottom:6px"><span class="ru" style="font-size:26px" lang="ru">${esc(it.ru)}</span>${playBtn(it.ru,'Play',false,it.en)}</div><div class="muted" style="margin-bottom:14px">${esc(it.en)}</div><div class="row">${micBtn('dMic',80,'Say it')}<div class="heard" id="dOut" style="flex:1">Tap the mic.</div></div><button class="btn quiet small" style="margin-top:12px" id="skipSpeak">I can’t speak right now</button>`;
    const typed = it.type==='listen'||it.type==='produce';
    box.innerHTML=`<div class="progress-top"><div class="bar"><i style="width:${i/items.length*100}%"></i></div><span class="muted">${i+1}/${items.length}</span></div>${body}
      ${typed?`<div class="field"><input id="dIn" autocomplete="off" autocapitalize="off" spellcheck="false" lang="ru" placeholder="Type in Russian">${KBD_TOGGLE}<button class="btn" id="dCheck">Check</button></div>${kbdHTML()}`:''}<div id="dfb"></div>`;
    const finish=(ok,mid)=>{
      if(ok) right++; onGrade&&onGrade(it,ok);
      $('#dfb',box).innerHTML=`<div class="fb ${ok?'ok':mid?'mid':'no'}">${ok?'Correct.':mid?'Almost.':'Answer:'} <b lang="ru">${esc(it.ru)}</b> <span class="tr">${esc(phon(it.ru))}</span><br>${esc(it.en)}</div><button class="btn" style="margin-top:12px" id="dNext">Continue</button>`;
      const nb=$('#dNext',box); nb.onclick=()=>{i++;next();};
    };
    if(it.type==='listen'){ speak(it.ru); }
    if(typed){
      const inp=$('#dIn',box); bindKbd(box,inp);
      const check=()=>{ if(!inp.value.trim()) return; inp.disabled=true; $('#dCheck',box).disabled=true; const r=checkTyped(inp.value,[it.ru]); finish(r.score>=0.85, r.score>=0.6); if(r.score>=0.85&&r.latin) toast('Right, in Latin letters. Try the АБВ keyboard next time.'); if(it.type==='produce') speak(it.ru); };
      $('#dCheck',box).onclick=check; inp.onkeydown=e=>{ if(e.key==='Enter') check(); };
    }
    if(it.type==='recognize') $$('[data-o]',box).forEach(b=>b.onclick=()=>{ $$('[data-o]',box).forEach(x=>{x.disabled=true; if(x.dataset.o===it.en) x.classList.add('right');}); const ok=b.dataset.o===it.en; if(!ok) b.classList.add('wrong'); finish(ok); });
    if(it.type==='speak'){
      let tries=0;
      $('#dMic',box).onclick=async e=>{ const sc=await sayCheck(e.currentTarget,it.ru,$('#dOut',box)); if(sc==null) return; tries++; if(sc>=0.75) finish(true); else if(tries>=2) finish(false,true); };
      $('#skipSpeak',box).onclick=()=>{ cancelRecording(); items[i]={...it,type:'produce'}; next(); };
    }
  };
  next();
}

    window.scrollTo(0,0);
  };
  const sr=$('#startRev'); if(sr) sr.onclick=()=>start(shuffle(due).slice(0,12));
  const pa=$('#practiceAny'); if(pa) pa.onclick=()=>start(shuffle(state.srs).slice(0,8));

    <label><div style="font-weight:600;margin-bottom:6px">Word</div>
      <div class="field"><input id="wWord" required maxlength="60" placeholder="e.g. tired" autocapitalize="off"></div></label>
    <label><div style="font-weight:600;margin-bottom:6px">How you’d use it <span class="muted" style="font-weight:400">(optional)</span></div>
      <div class="field"><input id="wSent" maxlength="200" placeholder="e.g. I’m tired after work"></div></label>
    <div class="row"><button class="btn" id="wGo" type="submit" ${has?'':'disabled'}>Translate</button><span class="muted" id="wStatus" style="font-size:15px"></span></div>
  </form>
  <section class="section" id="wResult"></section>
  ${state.words.length?`<section class="section"><h2>Your words</h2><ul class="list">${state.words.map(w=>`<li><button class="item" data-wid="${w.id}" style="grid-template-columns:1fr auto"><span><span class="t" lang="ru">${esc(unstress(w.word.ru))}</span> <span class="tr">${esc(phon(w.word.ru))}</span><br><span class="s">${esc(w.input)}${w.sentenceIn?' · “'+esc(w.sentenceIn)+'”':''}</span></span><span class="tag ${w.said&&w.said.length?'done-tag':''}">${w.said&&w.said.length?'Said':'New'}</span></button></li>`).join('')}</ul></section>`:''}`;
  $('#wForm').onsubmit=e=>{ e.preventDefault(); lookUpWord($('#wWord').value.trim(), $('#wSent').value.trim()); };
  $$('[data-wid]').forEach(b=>b.onclick=()=>{ showWord(state.words.find(w=>w.id===b.dataset.wid)); $('#wResult').scrollIntoView({behavior:'smooth'}); });
  if(openId) showWord(state.words.find(w=>w.id===openId));
}
async function lookUpWord(word, sentence){
  if(!word || wordsBusy) return;
  const st=$('#wStatus'), go=$('#wGo'); go.disabled=true; st.textContent='Translating…';
  wordsBusy=new AbortController();
  try{
    const r=await gemini({models:QUICK_MODELS, temperature:0.3, signal:wordsBusy.signal, contents:[{role:'user',parts:[{text:
`You help an English-speaking beginner learn Russian.
Word or phrase they want: "${word}"
${sentence?`How they want to use it: "${sentence}"`:'They gave no sentence.'}
The word may be in English or Russian. If it has several meanings, pick the one that fits their sentence (or the most common one).
In every Russian string, put a combining acute accent (U+0301) right after the stressed vowel of each word with more than one syllable, e.g. приве́т, спаси́бо. Never mark ё.
Reply with ONLY JSON:
{"word":{"ru":"the Russian word in its dictionary form","en":"short English meaning","info":"part of speech plus one useful grammar note, like gender or the other aspect of the verb, under 15 words"},
 "sentence":${sentence?'{"ru":"natural Russian translation of their sentence","en":"their sentence in clean English"}':'null'},
 "when":"two or three plain English sentences on when Russians use this word: the situations, formal or casual, and any common mix-up for English speakers",
 "example":{"ru":"one short, natural everyday Russian sentence using the word, different from theirs","en":"English translation"}}`}]}]});
    if(!r||!r.word||!r.word.ru||!r.example||!r.example.ru) throw {code:'bad_json'};
    const item={id:Date.now().toString(36), input:word, sentenceIn:sentence||'', word:{ru:String(r.word.ru),en:String(r.word.en||''),info:String(r.word.info||'')},
      sentence:sentence&&r.sentence&&r.sentence.ru?{ru:String(r.sentence.ru),en:String(r.sentence.en||sentence)}:null,
      when:String(r.when||''), example:{ru:String(r.example.ru),en:String(r.example.en||'')}, said:[]};
    state.words.unshift(item); state.words=state.words.slice(0,100); save();
    if((location.hash||'')==='#words') renderWords(item.id);
  }catch(e){
    if(e&&e.code==='cancelled') return;
    st.innerHTML=''; $('#wResult').innerHTML=`<div class="fb no">${esc(errCopy(e))}</div>`;
    go.disabled=false;
  }finally{ wordsBusy=null; }
}
function wordLine(ru, en){
  return `<div class="row" style="gap:10px;align-items:flex-start"><div style="flex:1"><div class="ruline" lang="ru">${esc(unstress(ru))}</div>${state.translit?`<div class="tr">${esc(phon(ru))}</div>`:''}<div class="muted" style="font-size:15px">${esc(en)}</div></div>${playBtn(unstress(ru),'Play',false,en)}</div>`;
}
function sayItHTML(key, ru){
  return `<div class="say-it">${micBtn('wMic-'+key,72,'Say it back')}<div style="flex:1"><div style="font-weight:600">Say it back</div><div class="heard" id="wOut-${key}">Listen first, then tap the mic and say the whole sentence.</div></div></div>`;
}
function showWord(w){
  if(!w) return;
  const box=$('#wResult');
  const blocks=[];
  if(w.sentence) blocks.push(['mine','Your sentence',w.sentence]);
  blocks.push(['ex','Example',w.example]);
  box.innerHTML=`<article class="panel wcard">
    <div class="row" style="justify-content:space-between;align-items:flex-start">
      <div><div class="big" lang="ru">${esc(unstress(w.word.ru))}</div>${state.translit?`<div class="tr">${esc(phon(w.word.ru))}</div>`:''}</div>
      ${playBtn(unstress(w.word.ru),'Hear the word',false,w.word.en)}
    </div>
    <p style="margin:8px 0 0"><b>${esc(w.word.en)}</b>${w.word.info?` <span class="muted">· ${esc(w.word.info)}</span>`:''}</p>
    ${w.when?`<div class="wblock"><div class="lbl">When to use it</div><p style="margin:0">${esc(w.when)}</p></div>`:''}
    ${blocks.map(([k,label,x])=>`<div class="wblock"><div class="lbl">${label}</div>${wordLine(x.ru,x.en)}${sayItHTML(k,x.ru)}</div>`).join('')}
    <div class="row" style="margin-top:18px"><button class="btn quiet small" id="wDeck">Add to review deck</button><button class="btn ghost small" id="wDel">Remove</button></div>
  </article>`;
  for(const [k,,x] of blocks){
    $('#wMic-'+k,box).onclick=async e=>{
      const score=await sayCheck(e.currentTarget, unstress(x.ru), $('#wOut-'+k,box));
      if(score!=null && score>=0.8 && !w.said.includes(k)){ w.said.push(k); addXP(2); save(); toast('+2 XP. Nicely said.'); }
    };
  }
  $('#wDeck',box).onclick=()=>{
    const n=addWords([{ru:unstress(w.word.ru),en:w.word.en}, ...blocks.map(([,,x])=>({ru:unstress(x.ru),en:x.en}))]);
    toast(n?`Added ${n} to your review deck.`:'Already in your review deck.');
  };
  $('#wDel',box).onclick=()=>{ state.words=state.words.filter(x=>x.id!==w.id); save(); renderWords(); };
}

/* ============ Saved: bookmarked words and phrases ============ */
function renderSaved(){
  const list=state.saved;
  app.innerHTML=`<h1>Saved</h1>
  <p class="lead" style="margin-top:8px">Words and phrases you bookmarked. Tap the bookmark next to any speaker button to add or remove one.</p>
  ${list.length?`<div class="row section"><button class="btn" id="svPractice" ${list.filter(x=>x.en).length?'':'disabled'}>Practice these</button><button class="btn ghost" id="svDeck">Add all to review deck</button></div>
  <section class="section" id="svDrill" hidden></section>
  <div class="phrases section" id="svList">${list.map((x,i)=>`<div class="phrase" style="grid-template-columns:1fr auto"><div><div class="ruline" lang="ru">${esc(x.ru)}</div>${state.translit?`<div class="tr">${esc(phon(x.ph||x.ru))}</div>`:''}${x.en?`<div class="muted" style="font-size:15px">${esc(x.en)}</div>`:''}</div>${playBtn(x.ru,'Play',false,x.en)}</div>`).join('')}</div>`
  :`<div class="panel section"><p style="margin:0">Nothing saved yet. Look for the bookmark <span class="say-pair sm" style="margin:0 4px">${saveBtn('—')}</span> next to the speaker buttons in lessons, conversations, Words and Wisdom.</p></div>`}`;
  const empty=$('#app .panel .save-btn'); if(empty) empty.disabled=true;
  // removing a bookmark here takes the row away
  $$('#svList .save-btn').forEach(b=>b.addEventListener('click',()=>setTimeout(renderSaved,0)));
  const dk=$('#svDeck'); if(dk) dk.onclick=()=>{ const n=addWords(list.filter(x=>x.en)); toast(n?`Added ${n} to your review deck.`:'They’re already in your review deck (items need an English meaning).'); };
  const pr=$('#svPractice'); if(pr) pr.onclick=()=>{
    const pool=list.filter(x=>x.en), box=$('#svDrill');
    box.hidden=false; box.className='section panel'; $('#svList').hidden=true; pr.parentElement.hidden=true;
    const items=buildItems(shuffle(pool).slice(0,8).map(x=>({ru:x.ru,en:x.en})), Math.min(10,Math.max(pool.length,4)));
    runDrills(box, items, pool, (right,total)=>{ addXP(right); box.innerHTML=`<h2>Practice done</h2><p>${right} of ${total} right. +${right} XP.</p><button class="btn" id="svBack">Back to saved</button>`; $('#svBack').onclick=renderSaved; });
  };
}

/* ============ Wisdom: Russian proverbs, idioms and sayings ============ */
const SAYING_KINDS=[
  ['mix','A mix','proverbs, idioms, everyday sayings and vivid metaphors'],
  ['proverb','Proverbs','пословицы: complete folk sayings with a lesson'],
  ['idiom','Idioms','фразеологизмы: fixed expressions whose meaning isn’t literal'],
  ['saying','Everyday sayings','поговорки and set phrases people use in daily conversation'],
  ['metaphor','Metaphors','vivid figurative images and comparisons Russians use'],
];
let sayingsKind='mix', sayingsBusy=null;
function sayingCard(x, i){
  return `<article class="panel saying" id="sy${i}">
    <div class="row" style="justify-content:space-between;align-items:flex-start;gap:10px">
      <div style="flex:1"><div class="ruline" lang="ru" style="font-size:22px;font-weight:700">${esc(unstress(x.ru))}</div>${state.translit?`<div class="tr">${esc(phon(x.ru))}</div>`:''}</div>
      ${playBtn(unstress(x.ru),'Hear the saying',false,x.meaning)}
    </div>
    <dl>
      ${x.literal?`<dt>Literally</dt><dd class="lit-line">“${esc(x.literal)}”</dd>`:''}
      <dt>Means</dt><dd>${esc(x.meaning)}</dd>
      ${x.equivalent?`<dt>In English</dt><dd>${esc(x.equivalent)}</dd>`:''}
      ${x.when?`<dt>When</dt><dd>${esc(x.when)}</dd>`:''}
      ${x.culture?`<dt>Culture</dt><dd>${esc(x.culture)}</dd>`:''}
    </dl>
    ${x.example&&x.example.ru?`<div class="wblock"><div class="lbl">In a conversation</div>${wordLine(x.example.ru,x.example.en||'')}</div>`:''}
    <div class="wblock"><div class="lbl">Say it back</div><div class="say-it" style="margin-top:4px">${micBtn('syMic'+i,64,'Say the saying')}<div class="heard" id="syOut${i}" style="flex:1">Play it, then say the saying out loud.</div></div></div>
  </article>`;
}
function renderSayings(){
  const has=getKey();
  app.innerHTML=`<h1>Wisdom</h1>
  <p class="lead" style="margin-top:8px">Пословицы и поговорки: the proverbs, idioms and images Russians actually use, with what they mean, when to say them, and the culture behind them.</p>
  ${has?'':`<div class="fb mid" style="margin-top:14px">Wisdom needs your free Gemini key. <button class="btn small" data-go="settings" style="margin-left:6px">Add it</button></div>`}
  <section class="panel section stack">
    <div class="chips" id="syKinds">${SAYING_KINDS.map(([k,l])=>`<button type="button" data-k="${k}" aria-pressed="${sayingsKind===k}">${l}</button>`).join('')}</div>
    <div class="field"><input id="syTopic" maxlength="60" placeholder="Topic, optional: work, love, food, weather…"></div>
    <div class="row"><button class="btn" id="syGo" ${has?'':'disabled'}>Show me 3</button><span class="muted" id="syStatus" style="font-size:15px"></span></div>
  </section>
  <div class="stack section" id="syList">${state.sayings.map((x,i)=>sayingCard(x,i)).join('')}</div>`;
  $$('#syKinds button').forEach(b=>b.onclick=()=>{ sayingsKind=b.dataset.k; $$('#syKinds button').forEach(x=>x.setAttribute('aria-pressed',String(x===b))); });
  $('#syGo').onclick=()=>getSayings($('#syTopic').value.trim());
  bindSayingMics();
}
function bindSayingMics(){
  state.sayings.forEach((x,i)=>{ const m=$('#syMic'+i); if(m) m.onclick=async e=>{
    const score=await sayCheck(e.currentTarget, unstress(x.ru), $('#syOut'+i));
    if(score!=null && score>=0.8 && !x.said){ x.said=1; addXP(3); save(); toast('+3 XP. Well said.'); }
  }; });
}
async function getSayings(topic){
  if(sayingsBusy) return;
  const st=$('#syStatus'), go=$('#syGo'); go.disabled=true; st.textContent='Finding some good ones…';
  const kind=SAYING_KINDS.find(k=>k[0]===sayingsKind);
  const seen=state.sayings.slice(0,40).map(x=>unstress(x.ru));
  sayingsBusy=new AbortController();
  try{
    const r=await gemini({models:QUICK_MODELS, temperature:0.9, signal:sayingsBusy.signal, contents:[{role:'user',parts:[{text:
`You teach Russian language and culture to an English-speaking beginner.
Give 3 Russian ${kind[2]}${topic?` about or related to: "${topic}"`:''}.
Only use real, well-known expressions that native Russian speakers genuinely use today. Never invent or paraphrase one. Prefer short ones a beginner can say.
${seen.length?`Don't repeat any of these: ${seen.join(' | ')}`:''}
In every Russian string, put a combining acute accent (U+0301) right after the stressed vowel of each word with more than one syllable. Never mark ё.
Reply with ONLY JSON: {"items":[{"ru":"the expression","literal":"word-for-word English","meaning":"what it really means, plain English","equivalent":"closest English saying, or empty string if none","when":"one sentence on when people say it and how formal it is","culture":"one or two sentences of cultural background, or empty string","example":{"ru":"a short, natural line of dialogue using it","en":"English translation"}}]}`}]}]});
    const items=(r&&Array.isArray(r.items)?r.items:[]).filter(x=>x&&x.ru&&x.meaning).map(x=>({ru:String(x.ru),literal:String(x.literal||''),meaning:String(x.meaning),equivalent:String(x.equivalent||''),when:String(x.when||''),culture:String(x.culture||''),example:x.example&&x.example.ru?{ru:String(x.example.ru),en:String(x.example.en||'')}:null}))
      .filter(x=>!state.sayings.some(y=>norm(y.ru)===norm(x.ru)));
    if(!items.length) throw {code:'bad_json'};
    state.sayings=[...items,...state.sayings].slice(0,60); save();
    if((location.hash||'')==='#sayings'){ renderSayings(); $('#syList').scrollIntoView({behavior:'smooth'}); }
  }catch(e){
    if(e&&e.code==='cancelled') return;
    st.innerHTML=`<span class="score bad">${esc(errCopy(e))}</span>`; go.disabled=false;
  }finally{ sayingsBusy=null; }
}

updateChips();
route();

</script>
